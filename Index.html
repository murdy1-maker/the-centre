<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Centre — Mobile Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #F8FAFC; color: #0F172A; display: flex; justify-content: center; min-height: 100vh; padding: 12px; }
    .phone-container { width: 100%; max-width: 420px; background: #FFFFFF; border-radius: 24px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); border: 1px solid #E2E8F0; overflow: hidden; display: flex; flex-direction: column; min-height: 85vh; }
    .header { padding: 20px 16px 12px; text-align: center; border-bottom: 1px solid #F1F5F9; background: #FFFFFF; }
    .logo { font-size: 22px; font-weight: 900; letter-spacing: 2px; color: #0F172A; }
    .tagline { font-size: 11px; color: #64748B; margin-top: 4px; }
    .content { padding: 16px; flex: 1; overflow-y: auto; }
    .card { background: #FFFFFF; border-radius: 8px; padding: 12px; margin-bottom: 14px; border: 1px solid #E2E8F0; }
    .label { font-size: 12px; font-weight: 700; color: #334155; margin-bottom: 6px; }
    .input { width: 100%; min-height: 70px; border: 1px solid #CBD5E1; border-radius: 6px; padding: 10px; font-size: 13px; color: #0F172A; resize: none; outline: none; }
    .input:focus { border-color: #0F172A; }
    .source-box { background: #F8FAFC; border-radius: 6px; padding: 10px; margin-bottom: 8px; border: 1px solid #E2E8F0; }
    .source-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .source-publisher { font-size: 12px; font-weight: 700; color: #0F172A; }
    .source-perspective { font-size: 10px; font-weight: 700; color: #2563EB; background: #EFF6FF; padding: 2px 6px; border-radius: 4px; }
    .source-text { font-size: 11px; color: #475569; line-height: 1.4; }
    .btn-primary { width: 100%; background: #0F172A; color: #FFFFFF; border: none; padding: 14px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 10px; }
    .btn-primary:active { opacity: 0.9; }
    .loading-box { text-align: center; padding: 24px 0; }
    .spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid #E2E8F0; border-top-color: #0F172A; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 12px; color: #64748B; margin-top: 12px; }
    .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .btn-small { background: #E2E8F0; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; color: #0F172A; cursor: pointer; }
    .task-badge { font-size: 11px; color: #64748B; font-family: monospace; }
    .query-box { background: #0F172A; border-radius: 8px; padding: 12px; margin-bottom: 12px; color: #FFFFFF; }
    .query-label { font-size: 10px; font-weight: 800; color: #94A3B8; letter-spacing: 1px; margin-bottom: 4px; }
    .query-text { font-size: 13px; font-weight: 600; line-height: 1.4; }
    .tab-bar { display: flex; background: #E2E8F0; border-radius: 8px; padding: 3px; margin-bottom: 12px; }
    .tab { flex: 1; padding: 8px 0; text-align: center; font-size: 11px; font-weight: 600; color: #64748B; border-radius: 6px; cursor: pointer; }
    .tab.active { background: #FFFFFF; color: #0F172A; font-weight: 700; }
    .synthesis-card { background: #FFFFFF; border-radius: 8px; padding: 14px; border: 1.5px solid #0F172A; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #F1F5F9; padding-bottom: 8px; }
    .card-title { font-size: 11px; font-weight: 800; letter-spacing: 1px; color: #0F172A; }
    .badge-outcome { background: #FEF3C7; color: #92400E; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; }
    .analysis-body { font-size: 13px; color: #1E293B; line-height: 1.55; }
    .conflict-card { background: #FFFFFF; border-radius: 8px; padding: 12px; margin-bottom: 10px; border: 1px solid #E2E8F0; border-left: 4px solid #3B82F6; }
    .conflict-theme { font-size: 12px; font-weight: 700; color: #0F172A; margin-bottom: 6px; }
    .ground-box { background: #F0FDF4; padding: 8px; border-radius: 4px; border: 1px solid #DCFCE7; }
    .ground-label { font-size: 10px; font-weight: 700; color: #166534; }
    .ground-text { font-size: 11px; color: #14532D; margin-top: 2px; line-height: 1.4; }
    .claim-card { background: #FFFFFF; border-radius: 8px; padding: 10px; margin-bottom: 8px; border: 1px solid #E2E8F0; }
    .claim-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .claim-source { font-size: 10px; font-weight: 600; color: #64748B; }
    .badge-evidence { padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: 700; background: #DCFCE7; color: #15803D; }
    .claim-assertion { font-size: 12px; color: #1E293B; margin-bottom: 4px; line-height: 1.4; font-weight: 500; }
    .claim-evidence { font-size: 10px; color: #64748B; }
  </style>
</head>
<body>
  <div class="phone-container">
    <div class="header">
      <div class="logo">THE CENTRE</div>
      <div class="tagline">Triangulated synthesis across competing perspectives</div>
    </div>
    
    <div class="content" id="appContent">
      <!-- Injected by JavaScript -->
    </div>
  </div>

  <script>
    const sampleAnalysis = {
      task_id: 'task-882194',
      user_query: 'Is interest rate policy lagging economic contraction?',
      sources_ingested: [
        { id: 'src_1', publisher: 'Global News Wire', perspective: 'CONSENSUS', raw_text: 'The central bank maintained current interest rates citing persistent 2.8% core inflation and stable employment figures according to the quarterly economic bulletin.' },
        { id: 'src_2', publisher: 'Contrarian Economic Review', perspective: 'CONTRARIAN', raw_text: 'Rate policy fails to reflect leading credit contraction indicators. Commercial lending fell 4.1% year-over-year, which historical cycles demonstrate triggers delayed recessions regardless of lagging employment metrics.' }
      ],
      extracted_claims: [
        { claim_id: 'c_01', source_id: 'src_1', core_assertion: 'Core inflation remains sticky at 2.8%, justifying rate maintenance.', cited_evidence: 'Quarterly Economic Bulletin (Table 4.2)', evidence_type: 'STATISTIC' },
        { claim_id: 'c_02', source_id: 'src_1', core_assertion: 'Current employment levels remain structurally stable.', cited_evidence: 'National Labour Force Survey', evidence_type: 'STATISTIC' },
        { claim_id: 'c_03', source_id: 'src_2', core_assertion: 'Commercial lending contracted by 4.1% year-over-year.', cited_evidence: 'Credit Market Aggregate Data Q3', evidence_type: 'STATISTIC' },
        { claim_id: 'c_04', source_id: 'src_2', core_assertion: 'Lagging employment metrics obscure impending recession risks.', cited_evidence: 'Historical cyclical comparison', evidence_type: 'SCIENTIFIC_STUDY' }
      ],
      mapped_conflicts: [
        { conflict_id: 'conf_01', theme: 'Indicator Prioritization: Lagging Employment vs. Leading Credit Metrics', conflict_type: 'DISPUTED_INTERPRETATION', common_ground: 'Both perspectives accept official economic data (inflation is at 2.8% while commercial lending has contracted), but disagree on which indicator governs policy timing.' }
      ],
      final_synthesis: {
        outcome_category: 'MIXED_EVIDENCE',
        central_analysis: 'The baseline data reveals structural divergence rather than factual contradiction. The central bank prioritizes contemporaneous price stability and employment resilience (core inflation at 2.8%), whereas contrarian analysis highlights forward-looking liquidity stress (commercial lending down 4.1%). The evidence does not refute current stability, but strongly supports the emergence of downstream credit headwinds. A definitive outcome cannot be determined without assessing future credit transmission velocity.',
        traceable_claims: ['c_01', 'c_02', 'c_03', 'c_04']
      }
    };

    let state = {
      completedTask: null,
      query: 'Is interest rate policy lagging economic contraction?',
      activeTab: 'SYNTHESIS'
    };

    function render() {
      const container = document.getElementById('appContent');
      if (!state.completedTask) {
        container.innerHTML = `
          <div class="card">
            <div class="label">Query / Topic to Analyze</div>
            <textarea class="input" id="queryInput" placeholder="Enter a topic or question...">${state.query}</textarea>
          </div>
          <div class="label">Ingested Sources (${sampleAnalysis.sources_ingested.length})</div>
          ${sampleAnalysis.sources_ingested.map(s => `
            <div class="source-box">
              <div class="source-top">
                <span class="source-publisher">${s.publisher}</span>
                <span class="source-perspective">[${s.perspective}]</span>
              </div>
              <div class="source-text">${s.raw_text}</div>
            </div>
          `).join('')}
          <button class="btn-primary" onclick="runAnalysis()">Run Central Analysis</button>
        `;
      } else {
        const t = state.completedTask;
        container.innerHTML = `
          <div class="top-row">
            <button class="btn-small" onclick="resetQuery()">← New Query</button>
            <span class="task-badge">${t.task_id}</span>
          </div>
          <div class="query-box">
            <div class="query-label">ANALYSIS SUBJECT</div>
            <div class="query-text">"${t.user_query}"</div>
          </div>
          <div class="tab-bar">
            <div class="tab ${state.activeTab === 'SYNTHESIS' ? 'active' : ''}" onclick="setTab('SYNTHESIS')">Synthesis</div>
            <div class="tab ${state.activeTab === 'CONFLICTS' ? 'active' : ''}" onclick="setTab('CONFLICTS')">Friction (${t.mapped_conflicts.length})</div>
            <div class="tab ${state.activeTab === 'CLAIMS' ? 'active' : ''}" onclick="setTab('CLAIMS')">Claims (${t.extracted_claims.length})</div>
          </div>
          ${state.activeTab === 'SYNTHESIS' ? `
            <div class="synthesis-card">
              <div class="card-header">
                <span class="card-title">CENTRAL ANALYSIS</span>
                <span class="badge-outcome">${t.final_synthesis.outcome_category}</span>
              </div>
              <div class="analysis-body">${t.final_synthesis.central_analysis}</div>
            </div>
          ` : ''}
          ${state.activeTab === 'CONFLICTS' ? t.mapped_conflicts.map(c => `
            <div class="conflict-card">
              <div class="conflict-theme">${c.theme}</div>
              <div class="ground-box">
                <div class="ground-label">✓ Baseline Common Ground:</div>
                <div class="ground-text">${c.common_ground}</div>
              </div>
            </div>
          `).join('') : ''}
          ${state.activeTab === 'CLAIMS' ? t.extracted_claims.map(c => `
            <div class="claim-card">
              <div class="claim-header">
                <span class="claim-source">Source: ${c.source_id}</span>
                <span class="badge-evidence">${c.evidence_type}</span>
              </div>
              <div class="claim-assertion">"${c.core_assertion}"</div>
              <div class="claim-evidence">Evidence: ${c.cited_evidence}</div>
            </div>
          `).join('') : ''}
        `;
      }
    }

    function runAnalysis() {
      const input = document.getElementById('queryInput');
      if (input) state.query = input.value;
      const container = document.getElementById('appContent');
      container.innerHTML = `
        <div class="loading-box">
          <div class="spinner"></div>
          <div class="loading-text" id="loadingText">Step 1/3: Extracting claims and stripping rhetoric...</div>
        </div>
      `;
      setTimeout(() => {
        const text = document.getElementById('loadingText');
        if (text) text.innerText = 'Step 2/3: Mapping friction and baseline common ground...';
        setTimeout(() => {
          if (text) text.innerText = 'Step 3/3: Synthesizing final central analysis...';
          setTimeout(() => {
            state.completedTask = { ...sampleAnalysis, user_query: state.query };
            render();
          }, 600);
        }, 600);
      }, 600);
    }

    function resetQuery() {
      state.completedTask = null;
      render();
    }

    function setTab(tab) {
      state.activeTab = tab;
      render();
    }

    render();
  </script>
</body>
</html>
